<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>User Dashboard</h1>
    
    <div id="signInDiv"></div>
    
    <div id="userInfo" style="display:none;">
        <h2>Signed In User:</h2>
        <p><strong>Name:</strong> <span id="userName"></span></p>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Picture:</strong></p>
        <img id="userPicture" width="100" height="100" alt="User Picture">
        <p><strong>Sign-in Time:</strong> <span id="signInTime"></span></p>
        <button onclick="signOut()">Sign Out</button>
    </div>

    <div id="userLog">
        <h2>User Activity Log:</h2>
        <ul id="logList"></ul>
    </div>

    <script>
        let users = [];
        
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            const user = {
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture,
                signInTime: new Date().toLocaleString()
            };
            
            // Store user data
            users.push(user);
            
            // Display current user
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userPicture').src = user.picture;
            document.getElementById('signInTime').textContent = user.signInTime;
            
            // Show user info, hide sign in
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('signInDiv').style.display = 'none';
            
            // Update log
            updateUserLog();
        }
        
        function decodeJwtResponse(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            
            return JSON.parse(jsonPayload);
        }
        
        function updateUserLog() {
            const logList = document.getElementById('logList');
            logList.innerHTML = '';
            
            users.forEach((user, index) => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                    <strong>${user.name}</strong> (${user.email}) - Signed in at ${user.signInTime}
                `;
                logList.appendChild(listItem);
            });
        }
        
        function signOut() {
            google.accounts.id.disableAutoSelect();
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('signInDiv').style.display = 'block';
        }
        
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "650247727271-mcufppu5e4u1ksdt8758lstfvnj9ki3i.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById("signInDiv"),
                { theme: "outline", size: "large" }
            );
        }
    </script>
</body>
</html>
