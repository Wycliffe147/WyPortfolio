<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
</head>
<body>
    <h1>User Dashboard</h1>
    
    <div id="stats">
        <h2>Statistics</h2>
        <p>Total Users: <span id="totalUsers">0</span></p>
        <p>Total Visits: <span id="totalVisits">0</span></p>
        <p>Last Updated: <span id="lastUpdated">Never</span></p>
    </div>

    <div id="users">
        <h2>Signed In Users</h2>
        <div id="usersList">No users found</div>
    </div>

    <div id="visits">
        <h2>Recent Visits</h2>
        <div id="visitsList">No visits found</div>
    </div>

    <button onclick="refreshData()">Refresh Data</button>
    <button onclick="exportData()">Export Data</button>
    <button onclick="clearData()">Clear All Data</button>

    <script>
        function loadUserData() {
            try {
                const data = localStorage.getItem('portfolioUserData');
                if (data) {
                    return JSON.parse(data);
                }
                return { users: [], visits: [] };
            } catch (error) {
                console.error('Error loading user data:', error);
                return { users: [], visits: [] };
            }
        }

        function displayStats(data) {
            document.getElementById('totalUsers').textContent = data.users.length;
            document.getElementById('totalVisits').textContent = data.visits.length;
            document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
        }

        function displayUsers(users) {
            const usersList = document.getElementById('usersList');
            
            if (users.length === 0) {
                usersList.innerHTML = '<p>No users found</p>';
                return;
            }

            let html = '<table border="1" style="width: 100%; border-collapse: collapse;">';
            html += '<tr><th>Name</th><th>Email</th><th>First Seen</th><th>Last Seen</th></tr>';
            
            users.forEach(user => {
                html += `<tr>
                    <td>${user.name || 'N/A'}</td>
                    <td>${user.email || 'N/A'}</td>
                    <td>${user.firstSeen ? new Date(user.firstSeen).toLocaleString() : 'N/A'}</td>
                    <td>${user.lastSeen ? new Date(user.lastSeen).toLocaleString() : 'Same as first seen'}</td>
                </tr>`;
            });
            
            html += '</table>';
            usersList.innerHTML = html;
        }

        function displayVisits(visits) {
            const visitsList = document.getElementById('visitsList');
            
            if (visits.length === 0) {
                visitsList.innerHTML = '<p>No visits found</p>';
                return;
            }

            let html = '<table border="1" style="width: 100%; border-collapse: collapse;">';
            html += '<tr><th>Email</th><th>Time</th><th>Page</th><th>Referrer</th></tr>';
            
            // Show most recent visits first
            const recentVisits = visits.slice(-20).reverse();
            
            recentVisits.forEach(visit => {
                html += `<tr>
                    <td>${visit.email || 'N/A'}</td>
                    <td>${visit.timestamp ? new Date(visit.timestamp).toLocaleString() : 'N/A'}</td>
                    <td>${visit.page || 'N/A'}</td>
                    <td>${visit.referrer || 'Direct'}</td>
                </tr>`;
            });
            
            html += '</table>';
            visitsList.innerHTML = html;
        }

        function refreshData() {
            const data = loadUserData();
            displayStats(data);
            displayUsers(data.users);
            displayVisits(data.visits);
        }

        function exportData() {
            const data = loadUserData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'user-data-' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearData() {
            if (confirm('Are you sure you want to clear all user data? This cannot be undone.')) {
                localStorage.removeItem('portfolioUserData');
                refreshData();
                alert('All data has been cleared.');
            }
        }

        // Auto-refresh every 30 seconds
        setInterval(refreshData, 30000);

        // Initial load
        refreshData();
    </script>
</body>
</html>
