<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Wy's Portfolio</title>
</head>
<body>
    <h1>User Dashboard</h1>
    <p>Collecting user data from visitors who sign in through Google authentication.</p>
    
    <div id="stats">
        <h2>Statistics</h2>
        <p>Total Users: <span id="totalUsers">0</span></p>
        <p>Users Today: <span id="todayUsers">0</span></p>
        <p>Last Updated: <span id="lastUpdate">Never</span></p>
    </div>
    
    <div id="userList">
        <h2>Signed In Users</h2>
        <div id="users">
            <p>No users found.</p>
        </div>
    </div>
    
    <button onclick="refreshData()">Refresh Data</button>
    <button onclick="clearData()">Clear All Data</button>
    
    <script>
        // Simple data collection system using localStorage
        
        function loadUserData() {
            try {
                const data = localStorage.getItem('portfolioUserData');
                return data ? JSON.parse(data) : { users: [], visits: [] };
            } catch (e) {
                console.error('Error loading data:', e);
                return { users: [], visits: [] };
            }
        }
        
        function saveUserData(data) {
            try {
                localStorage.setItem('portfolioUserData', JSON.stringify(data));
            } catch (e) {
                console.error('Error saving data:', e);
            }
        }
        
        function displayUserData() {
            const data = loadUserData();
            const userContainer = document.getElementById('users');
            const totalUsersSpan = document.getElementById('totalUsers');
            const todayUsersSpan = document.getElementById('todayUsers');
            const lastUpdateSpan = document.getElementById('lastUpdate');
            
            // Update statistics
            totalUsersSpan.textContent = data.users.length;
            
            // Count today's users
            const today = new Date().toDateString();
            const todayCount = data.visits.filter(visit => 
                new Date(visit.timestamp).toDateString() === today
            ).length;
            todayUsersSpan.textContent = todayCount;
            
            lastUpdateSpan.textContent = new Date().toLocaleString();
            
            // Display user list
            if (data.users.length === 0) {
                userContainer.innerHTML = '<p>No users found.</p>';
                return;
            }
            
            let html = '<table border="1" style="width:100%; border-collapse: collapse;">';
            html += '<tr><th>Name</th><th>Email</th><th>First Visit</th><th>Last Visit</th><th>Total Visits</th></tr>';
            
            data.users.forEach(user => {
                const userVisits = data.visits.filter(v => v.email === user.email);
                const firstVisit = userVisits.length > 0 ? 
                    new Date(Math.min(...userVisits.map(v => new Date(v.timestamp)))).toLocaleDateString() : 'Unknown';
                const lastVisit = userVisits.length > 0 ? 
                    new Date(Math.max(...userVisits.map(v => new Date(v.timestamp)))).toLocaleDateString() : 'Unknown';
                
                html += `<tr>
                    <td>${user.name || 'Unknown'}</td>
                    <td>${user.email || 'Unknown'}</td>
                    <td>${firstVisit}</td>
                    <td>${lastVisit}</td>
                    <td>${userVisits.length}</td>
                </tr>`;
            });
            
            html += '</table>';
            userContainer.innerHTML = html;
        }
        
        function refreshData() {
            displayUserData();
        }
        
        function clearData() {
            if (confirm('Are you sure you want to clear all user data?')) {
                localStorage.removeItem('portfolioUserData');
                displayUserData();
            }
        }
        
        // Data collection functions (to be used by your main website)
        window.addUserData = function(userInfo) {
            const data = loadUserData();
            
            // Add or update user
            const existingUserIndex = data.users.findIndex(u => u.email === userInfo.email);
            if (existingUserIndex === -1) {
                data.users.push({
                    name: userInfo.name,
                    email: userInfo.email,
                    firstSeen: new Date().toISOString()
                });
            } else {
                // Update existing user info
                data.users[existingUserIndex] = {
                    ...data.users[existingUserIndex],
                    name: userInfo.name,
                    lastSeen: new Date().toISOString()
                };
            }
            
            // Add visit record
            data.visits.push({
                email: userInfo.email,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                referrer: document.referrer
            });
            
            saveUserData(data);
        };
        
        // Initialize dashboard
        displayUserData();
        
        // Auto-refresh every 30 seconds
        setInterval(displayUserData, 30000);
        
        // Listen for storage changes (if multiple tabs open)
        window.addEventListener('storage', function(e) {
            if (e.key === 'portfolioUserData') {
                displayUserData();
            }
        });
    </script>
</body>
</html>
